name: Pull BALLDONTLIE rookie stats

on:
  workflow_dispatch:
    inputs:
      season:
        description: NBA season (YYYY-YY)
        required: true
        default: 2026-27
        type: string
      full_refresh:
        description: Rebuild all season stats and eligibility (ignore cached data)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: collect-balldontlie
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Check production deployment configuration
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Production stat pulls must run from the repository's default branch."
            exit 1
          fi
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore collection cache
        if: ${{ !inputs.full_refresh }}
        uses: actions/cache/restore@v4.2.4
        with:
          path: .cache/balldontlie/*.json
          key: balldontlie-v1-${{ inputs.season }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            balldontlie-v1-${{ inputs.season }}-

      - name: Collect BALLDONTLIE snapshot
        id: collection
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          SEASON: ${{ inputs.season }}
          FULL_REFRESH: ${{ inputs.full_refresh }}
          REQUESTS_PER_MINUTE: ${{ vars.BALLDONTLIE_REQUESTS_PER_MINUTE || '60' }}
          CONCURRENCY: ${{ vars.BALLDONTLIE_CONCURRENCY || '4' }}
          REFRESH_DAYS: ${{ vars.BALLDONTLIE_REFRESH_DAYS || '7' }}
        run: |
          set -o pipefail
          mkdir -p .cache/balldontlie
          args=(--season "$SEASON" --requests-per-minute "$REQUESTS_PER_MINUTE" --concurrency "$CONCURRENCY" --refresh-days "$REFRESH_DAYS")
          if [ "$FULL_REFRESH" = "true" ]; then args+=(--full-refresh); fi
          npm run collect:balldontlie -- "${args[@]}" | tee .cache/balldontlie/collection.log

      - name: Validate snapshot
        run: npm run validate:snapshot

      - name: Stage optional reviewed forecast inputs
        env:
          SEASON: ${{ inputs.season }}
          ROOKIE_POOL_JSON: ${{ vars.ROOKIE_POOL_JSON }}
          FORECAST_MODEL_JSON: ${{ vars.FORECAST_MODEL_JSON }}
          ODDS_ALIASES_JSON: ${{ vars.ODDS_ALIASES_JSON }}
          LICENSED_ODDS_JSON: ${{ vars.LICENSED_ODDS_JSON }}
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { mkdir, writeFile } from "node:fs/promises";
          import { validateForecastPool, validateForecastModel } from "./src/lib/forecast.ts";
          await mkdir("data", { recursive: true });
          try {
            if (process.env.ROOKIE_POOL_JSON) {
              const pool = validateForecastPool(JSON.parse(process.env.ROOKIE_POOL_JSON));
              if (pool.season !== process.env.SEASON || pool.provider !== "BALLDONTLIE") throw new Error();
              await writeFile("data/rookie-pool.json", JSON.stringify(pool));
            }
            if (process.env.FORECAST_MODEL_JSON) {
              const model = validateForecastModel(JSON.parse(process.env.FORECAST_MODEL_JSON));
              if (model.trainedThrough >= process.env.SEASON) throw new Error();
              await writeFile("data/forecast-model.json", JSON.stringify(model));
            }
            if (process.env.ODDS_ALIASES_JSON && process.env.LICENSED_ODDS_JSON) throw new Error();
            for (const [name, path] of [
              ["ODDS_ALIASES_JSON", "/tmp/roty-odds-aliases.json"],
              ["LICENSED_ODDS_JSON", "/tmp/roty-licensed-odds.json"],
            ]) {
              if (process.env[name]) await writeFile(path, JSON.stringify(JSON.parse(process.env[name])), { mode: 0o600 });
            }
          } catch {
            console.error("Invalid reviewed forecast inputs. Check season, provider namespace, model dates, and JSON; no deployment attempted.");
            process.exitCode = 1;
          }
          NODE

      - name: Collect optional licensed sportsbook prices
        if: ${{ vars.ODDS_ALIASES_JSON != '' || vars.LICENSED_ODDS_JSON != '' }}
        env:
          SEASON: ${{ inputs.season }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REDISTRIBUTION_APPROVED: ${{ vars.ODDS_REDISTRIBUTION_APPROVED }}
        run: |
          if [ -f /tmp/roty-licensed-odds.json ]; then
            npm run collect:odds -- --season "$SEASON" --input /tmp/roty-licensed-odds.json
          else
            npm run collect:odds -- --season "$SEASON" --aliases /tmp/roty-odds-aliases.json
          fi

      - name: Save collection cache
        uses: actions/cache/save@v4.2.4
        with:
          path: .cache/balldontlie/*.json
          key: balldontlie-v1-${{ inputs.season }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: balldontlie-snapshot-${{ github.run_id }}
          path: data/live-snapshot.json
          if-no-files-found: error
          retention-days: 7

      - name: Pull Vercel production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          SECONDS=0
          trap 'echo "Vercel settings: ${SECONDS}s" >> "$GITHUB_STEP_SUMMARY"' EXIT
          npx --yes vercel@65.2.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production snapshot
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATA_SOURCE: snapshot
        run: |
          SECONDS=0
          trap 'echo "Production build: ${SECONDS}s" >> "$GITHUB_STEP_SUMMARY"' EXIT
          # Override any demo setting pulled from the Vercel project.
          printf '\nDATA_SOURCE=snapshot\n' >> .vercel/.env.production.local
          npm run validate:snapshot
          npx --yes vercel@65.2.0 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy snapshot to Vercel production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          SECONDS=0
          trap 'echo "Production deployment: ${SECONDS}s" >> "$GITHUB_STEP_SUMMARY"' EXIT
          npx --yes vercel@65.2.0 deploy --prebuilt --prod --yes --env DATA_SOURCE=snapshot --token="$VERCEL_TOKEN"

      - name: Write run summary
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          if [ -f .cache/balldontlie/collection.log ]; then
            printf '### Collection timings and requests\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
            cat .cache/balldontlie/collection.log >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f data/live-snapshot.json ]; then
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const s = JSON.parse(readFileSync("data/live-snapshot.json", "utf8"));
              console.log(`## BALLDONTLIE snapshot (${s.season})`);
              console.log(`${s.rookies.length} first-season players. Collected ${s.updatedAt}.`);
              console.log("The balldontlie-snapshot artifact is available for download. Data was not committed.");
              console.log(process.env.DEPLOY_OUTCOME === "success"
                ? "The new snapshot was built and deployed to Vercel production."
                : "Production deployment did not complete successfully. Check the configuration, build, and deployment step logs.");
              console.log("Eligibility is inferred from provider history, not an official NBA rookie list.");
            ' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## BALLDONTLIE collection failed" >> "$GITHUB_STEP_SUMMARY"
            echo "No snapshot was produced or deployed. Check the configuration/collection step logs, required secrets, and NBA subscription access." >> "$GITHUB_STEP_SUMMARY"
          fi
